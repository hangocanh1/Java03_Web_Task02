<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-page-container">
    
    <div class="login-header text-center">
      <div class="brand-badge-m">M</div>
      <h1 class="welcome-title">Welcome Back!</h1>
      <p class="welcome-subtitle">Sign in to continue to your account.</p>
    </div>

    <div class="login-card">
      <div class="card-header-text">
        <h2 class="form-title">Login to your account</h2>
        <p class="form-subtitle">Enter your email and password to get started.</p>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="emailInput" class="form-label-custom">Email Address</label>
          <input 
            type="email" 
            class="form-control custom-input" 
            id="emailInput" 
            placeholder="name@example.com" 
            required
          >
        </div>

        <div class="mb-3">
          <div class="password-label-row">
            <label for="passwordInput" class="form-label-custom">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              class="form-control custom-input password-input" 
              id="passwordInput" 
              placeholder="Enter your password" 
              required
            >
            <button type="button" class="btn-toggle-password" id="togglePassword">Show</button>
          </div>
        </div>

        <div class="mb-4 form-check custom-checkbox-row">
          <input type="checkbox" class="form-check-input custom-checkbox" id="rememberMe">
          <label class="form-check-label check-label" for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn-sign-in">Sign In</button>
      </form>

      <div class="card-footer-link text-center">
        Don't have an account? <a href="#" class="create-account-link">Create an account</a>
      </div>
    </div>

    <footer class="login-footer text-center">
      © 2026 My Website. All rights reserved.
    </footer>

  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          toggleBtn.textContent = 'Hide';
        } else {
          passwordInput.type = 'password';
          toggleBtn.textContent = 'Show';
        }
      });
    }

    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Login successful!');
        window.location.href = 'courses.html';
      });
    }
  </script>
</body>
</html>
